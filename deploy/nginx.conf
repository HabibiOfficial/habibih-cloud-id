server {
    listen 80;
    listen [::]:80;
    server_name api.habibicloudserver.dpdns.org habibicloudserver.dpdns.org _;

    client_max_body_size 100M;

    # Kompresi
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Halaman & aset statis
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Jangan cache HTML & aset — supaya update langsung tampil
        # tanpa perlu hard refresh di browser pengguna.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # Aset statis boleh di-cache sebentar supaya tetap ringan
    location /assets/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    access_log /var/log/nginx/habi-api.access.log;
    error_log  /var/log/nginx/habi-api.error.log;
}
