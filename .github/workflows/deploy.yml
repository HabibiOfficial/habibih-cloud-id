name: Deploy ke VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy HABI API Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          APP_DIR: ${{ vars.APP_DIR || '/home/deploy/apps/habi-api-web' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # known_hosts dilewati supaya tidak error host key
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "echo 'SSH OK'"

          # rsync file (node_modules & .git tidak ikut)
          rsync -az --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.env' \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p $VPS_PORT" \
            ./ "$VPS_USER@$VPS_HOST:$APP_DIR/"

          # jalankan script deploy di server
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
              "cd $APP_DIR && bash scripts/deploy.sh"

      - name: Smoke test
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          sleep 5
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "${{ secrets.VPS_USER }}@$VPS_HOST" \
              "curl -fsS http://127.0.0.1:8080/healthz"
